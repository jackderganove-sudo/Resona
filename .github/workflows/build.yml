name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Queue instead of cancel: a cancelled run would throw away an in-flight
# ffmpeg-kit build before it reaches the cache.
concurrency:
  group: resona-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_KIT_TAG: v9.0.0

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for version and release notes

      # main: next patch version after the latest v* tag (v0.8.0 -> 0.8.1),
      # unless this commit is already tagged. Tags: the tag itself.
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          last=${last:-v0.0.0}
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" == "push" ]] \
             && ! git tag --points-at HEAD | grep -q '^v'; then
            IFS=. read -r major minor patch <<< "${last#v}"
            echo "version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${last#v}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # ffmpeg-kit is compiled from source on the first run (~30-60 min);
      # afterwards the XCFrameworks come from this cache.
      - name: Restore ffmpeg-kit XCFrameworks
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}-${{ runner.arch }}

      - name: Build IPA
        run: |
          chmod +x ./build_ipa.sh
          mkdir -p build
          export MARKETING_VERSION="${{ steps.version.outputs.version }}"
          ./build_ipa.sh 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD|IPA created" || true
          test -f build/Resona.ipa
        env:
          FFMPEG_KIT_TAG: ${{ env.FFMPEG_KIT_TAG }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}

      # Saved even when the Swift build fails, so a compile error never
      # throws away the expensive ffmpeg build.
      - name: Save ffmpeg-kit XCFrameworks
        if: always() && steps.ffmpeg-cache.outputs.cache-hit != 'true' && hashFiles('build/ffmpeg-kit-xcframeworks/**') != ''
        uses: actions/cache/save@v4
        with:
          path: build/ffmpeg-kit-xcframeworks
          key: ffmpeg-kit-${{ env.FFMPEG_KIT_TAG }}-arm64+sim-openssl-${{ runner.os }}-${{ runner.arch }}

      - name: Show compiler errors
        if: failure()
        run: |
          test -f build/xcodebuild.log || exit 0
          grep -E "error:" build/xcodebuild.log | sort -u | head -150 || true
          tail -60 build/xcodebuild.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resona-${{ github.run_number }}
          path: build/Resona.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/Resona.ipa \
            --title "Resona ${{ github.ref_name }}" \
            --generate-notes

      # Every green build on main becomes a release: tag v<version>, IPA
      # attached directly, notes = commit subjects since the previous tag.
      # (Tags created with GITHUB_TOKEN don't start another workflow run.)
      - name: Publish release (main)
        id: release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          last="${{ steps.version.outputs.last }}"
          if git rev-parse -q --verify "refs/tags/$last" >/dev/null; then range="$last..HEAD"; else range="HEAD"; fi
          git log "$range" --no-merges --pretty='- %s' | grep -v '^- Merge' > build/changelog.md || true
          [ -s build/changelog.md ] || echo "- Bug fixes and improvements" > build/changelog.md
          gh release create "$tag" build/Resona.ipa \
            --target "$GITHUB_SHA" \
            --title "Resona $tag" \
            --notes-file build/changelog.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # AltStore/ESign source on the app-source branch (raw URL in README).
      - name: Update app source (apps.json)
        if: steps.version.outputs.release == 'true' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          size=$(stat -f%z build/Resona.ipa)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/Resona.ipa"
          [ -f build/changelog.md ] || gh release view "$tag" --json body -q .body > build/changelog.md || echo "- Bug fixes and improvements" > build/changelog.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin app-source >/dev/null; then
            git fetch origin app-source
            git worktree add build/source origin/app-source
            git -C build/source checkout -B app-source
          else
            git worktree add --detach build/source
            git -C build/source checkout --orphan app-source
            git -C build/source rm -rf . >/dev/null
          fi
          python3 scripts/update_app_source.py build/source/apps.json "$version" "${{ github.run_number }}" "$url" "$size" build/changelog.md
          # Validate before publishing: parseable JSON with the fields
          # ESign/AltStore need, pointing at this version's IPA.
          python3 - build/source/apps.json "$version" "$url" <<'PY'
          import json, sys
          path, version, url = sys.argv[1:4]
          data = json.load(open(path, encoding="utf-8"))
          app = data["apps"][0]
          for key in ("name", "bundleIdentifier", "iconURL", "versions", "version", "downloadURL", "size"):
              assert key in app, f"missing {key}"
          assert app["versions"][0]["version"] == version and app["versions"][0]["downloadURL"] == url
          assert app["iconURL"].startswith("https://raw.githubusercontent.com/")
          print("apps.json valid:", version)
          PY
          git -C build/source add apps.json
          git -C build/source commit -m "App source: Resona $version (${{ github.run_number }})"
          git -C build/source push origin app-source
